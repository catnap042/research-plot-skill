name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install a CJK font (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Require CJK glyph check on Linux (fonts-noto-cjk installed above)
        if: runner.os == 'Linux'
        run: echo "CI_REQUIRE_CJK=1" >> "$GITHUB_ENV"
      - run: python -m pytest -q -rs tests
      - name: Quickstart and gallery smoke test
        run: |
          python examples/quickstart.py out/quickstart
          python examples/make_gallery.py bw talk --out out/gallery
